# gitleaks' own rules for secrets, plus one for personal data: maquereau and its app are
# published, so neither may name the person who built them.

[extend]
useDefault = true

[[rules]]
id = "home-directory-path"
description = "An absolute path into a home directory gives away a user name"
regex = '''/(?:Users|home)/[A-Za-z0-9._-]+/'''

# CI runners build as `runner`; the tests use `/home/me`.
[[rules.allowlists]]
regexes = ['''/(?:Users|home)/(?:runner|me)/''']
