# Publishes a version from main, with no laptop involved: start it from the Actions tab
# or with `gh workflow run release -f version=0.2.0`. The macOS build restores main's
# cache, sets the version, and only once the app is built and scanned commits, tags and
# releases it.
# `just publish` does the same from a Mac, as a fallback.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, such as 0.2.0.
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check main, the version, and CI on main's head
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::release from main, not $GITHUB_REF"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION is not a semantic version"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then echo "::error::v$VERSION already exists"; exit 1; fi
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow CI --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          [[ "$ci" == "completed success" ]] || { echo "::error::CI has not passed on $GITHUB_SHA (${ci:-no run})"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}

  build:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # Only main writes this cache, and only trusted code runs on main.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 zizmor: ignore[cache-poisoning]
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install the dependencies from the lockfiles
        run: just deps frozen

      - name: Set the version, build, scan and zip the app
        id: app
        run: |
          just set-version "$VERSION"
          just build
          echo "archive=$(just package "$VERSION")" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - name: Commit, tag and push the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit --quiet -m "Publish $VERSION" src-tauri/Cargo.toml src-tauri/Cargo.lock
          git tag -a "v$VERSION" -m "maquereau $VERSION"
          gh auth setup-git
          # Atomic: if main moved since the run started, neither the commit nor the tag lands.
          git push --atomic origin HEAD:main "v$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}

      - name: Release the app
        run: gh release create "v$VERSION" --verify-tag --title "maquereau $VERSION" --generate-notes "$ARCHIVE"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ARCHIVE: ${{ steps.app.outputs.archive }}
