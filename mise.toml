# Every tool needed to develop or build maquereau, pinned.
# Run them through the Justfile, never directly.

[tools]
# The macOS target lets Linux CI lint the macOS code.
rust = { version = "1.98.1", components = "rustfmt,clippy", targets = "aarch64-apple-darwin" }
deno = "2.9.7"
just = "1.58.0"
act = "0.2.89"
taplo = "0.10.0"
rumdl = "0.2.77"
typos = "1.50.2"
cargo-binstall = "1.23.0"
"cargo:cargo-nextest" = "0.9.146"
"cargo:cargo-deny" = "0.20.2"
gitleaks = "8.30.1"
zizmor = "1.30.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[settings]
# Install cargo tools from their prebuilt binaries rather than compiling them.
cargo.binstall = true
